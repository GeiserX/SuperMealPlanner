[project]
name = "supermealplanner"
dynamic = ["version"]
description = "Self-hosted household meal planner: one shared menu, a plate sized to each person, batch cooking around your calendar, shopping lists per store and a Telegram bot"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "icalendar==7.3.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "recurring-ical-events==3.8.2",
    "ruamel-yaml==0.19.1",
    "uvicorn==0.54.0",
]

[project.scripts]
supermealplanner = "supermealplanner.cli:main"
smp = "supermealplanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "supermealplanner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["supermealplanner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
