bot_about_changes: "⚙️ Changes\nAsk me to change the menu: another dish for a day, two days swapped, a pause while you eat what you have at home, or a new draw from a Monday. Ask me too for a reminder, the batch days, the lunch time, the weekly rules, guests, foods to avoid, the shopping stores, how I answer, a new recipe or a change to one you have (for example taking it out of breakfast). Tell me things about each of you that I should keep in mind and I note them. What you ask for I do at once and tell you what changed; it can be undone. When the idea is mine, I show it and wait for your yes. Pills, calories and goals are never changed from the chat."
