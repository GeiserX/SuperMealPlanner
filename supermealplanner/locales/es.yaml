bot_about_changes: "⚙️ Cambios\nPedidme cambiar el menú: otro plato para un día, intercambiar dos días, una pausa mientras coméis lo que tenéis en casa, o un menú nuevo a partir de un lunes. Pedidme también un recordatorio, los días de batch, la hora de comer, las reglas de la semana, los invitados, los alimentos que evitáis, las tiendas de la compra, cómo os respondo, una receta nueva o un cambio en una que ya tenéis (por ejemplo, quitarla del desayuno). Contadme cosas de cada uno que deba tener en cuenta y las apunto. Lo que me pedís lo hago al momento y os digo qué ha cambiado; se puede deshacer. Cuando la idea es mía, os la enseño y espero vuestro sí. Las pastillas, las calorías y los objetivos nunca se cambian desde el chat."
