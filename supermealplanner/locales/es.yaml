review_turn: "[Revisión semanal, automática: no lo ha escrito nadie] Revisa la semana del {week} ({d}) antes de la compra de la semana, día a día: que el menú cumple todo lo que hemos pedido en el chat y en las instrucciones (lo que le gusta y no le gusta a cada uno, la salud de cada uno, los invitados, los días sin cocinar), que no se desperdicia nada de lo comprado o de lo que hay en casa (lo comprado que no usa ningún plato entra en el menú antes de que se estropee), que cada sesión de cocinar por adelantado se puede hacer (remojo, descongelar, tiempo) y que la lista está bien, y los problemas que ha encontrado la app (en tus datos). Arregla con cambios del menú lo que no cumpla, sin volver a preguntar lo ya decidido, y escribe un solo mensaje corto al grupo: qué has cambiado y por qué, y qué tiene que hacer cada uno esta semana. Si todo cuadra, dilo en una línea."
